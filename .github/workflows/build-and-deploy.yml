name: Build and Deploy (GitHub Pages)

# The live site (zhassulan.netlify.app) is deployed by Netlify straight from
# this repository, so this workflow no longer runs on every push — doing both
# meant two deploy pipelines for one site, and this one skipped the tests.
# It is kept for publishing to GitHub Pages on demand: run it from the
# Actions tab. To restore automatic runs, add `push: { branches: [main] }`.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install, test & generate 🔧
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run generate
        env:
          NUXT_APP_BASE_URL: ${{ vars.NUXT_APP_BASE_URL }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
